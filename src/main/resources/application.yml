spring:
  application:
    name: livecomerce
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/livecomerce}
    username: ${DB_USERNAME:livecomerce}
    password: ${DB_PASSWORD:livecomerce}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Fail fast instead of hanging request and scheduler threads when Redis is unreachable.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

  task:
    scheduling:
      pool:
        # Several @Scheduled jobs (billing, stale lives, feed reconciliation); one thread would serialize them.
        size: ${SCHEDULING_POOL_SIZE:4}

  mvc:
    async:
      # Async requests are the live feed SSE stream: same as live.feed.sse.timeout-ms so the
      # container never times it out before the emitter does.
      request-timeout: ${live.feed.sse.timeout-ms}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: livecomerce-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        queue-not-found-strategy: fail

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:livecomerce-secret-key-change-this-in-production-min-32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

order:
  reservation:
    ttl-minutes: ${ORDER_RESERVATION_TTL_MINUTES:10}
    expiry-check-ms: ${ORDER_RESERVATION_EXPIRY_CHECK_MS:60000}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
  oauth2:
    code-ttl-seconds: ${OAUTH2_CODE_TTL_SECONDS:90}
  billing:
    success-url: ${BILLING_SUCCESS_URL:http://localhost:3000/billing/success}
    cancel-url: ${BILLING_CANCEL_URL:http://localhost:3000/billing/cancel}
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_placeholder}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
      price-ids:
        STARTER: ${STRIPE_PRICE_STARTER:price_placeholder}
        PRO: ${STRIPE_PRICE_PRO:price_placeholder}
        AGENCY: ${STRIPE_PRICE_AGENCY:/v1/prices/price_1TRlgz7T0J4CsjNYiKNJXV4I}
  payment:
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_placeholder}
      webhook-secret: ${PAYMENT_STRIPE_WEBHOOK_SECRET:whsec_placeholder}
      connect:
        refresh-url: ${STRIPE_CONNECT_REFRESH_URL:http://localhost:3000/seller/payout/refresh}
        return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:3000/seller/payout/return}

agora:
  app-id: ${AGORA_APP_ID}
  app-certificate: ${AGORA_APP_CERTIFICATE}
  webhook-secret: ${AGORA_WEBHOOK_SECRET}
  customer-id: ${AGORA_CUSTOMER_ID}
  customer-secret: ${AGORA_CUSTOMER_SECRET}

ivs:
  region: ${AWS_REGION:us-east-1}
  channel-type: ${IVS_CHANNEL_TYPE:STANDARD}
  latency-mode: LOW
  stream-events-queue-name: ${IVS_STREAM_EVENTS_QUEUE_NAME:ivs_stream_events}

live:
  video-provider: ${LIVE_VIDEO_PROVIDER}
  feed:
    agora:
      # Legacy Agora RTM "lives-feed" broadcast (LiveFeedBroadcastListener). Superseded by the
      # SSE live feed; turn off once the frontend no longer subscribes to the Agora channel.
      enabled: ${LIVE_FEED_AGORA_ENABLED:true}
    # Interval of the feed snapshot drift reconciliation (LiveFeedReconciliationJob); its
    # cross-replica lease lasts 90% of it.
    reconcile-ms: ${LIVE_FEED_RECONCILE_MS:60000}
    sse:
      # GET /api/lives/feed/stream. Emitter lifetime: under Railway's 15 min request cap; the
      # client reconnects with Last-Event-ID. Keep server.compression off (or exclude
      # text/event-stream): gzip buffers the stream.
      timeout-ms: ${LIVE_FEED_SSE_TIMEOUT_MS:840000}
      # ": ping" comment interval; keeps the edge from idling the connection out and drops dead ones.
      ping-ms: ${LIVE_FEED_SSE_PING_MS:20000}
      # Run the fan-out/ping executor on a virtual thread. Off: check pinning first.
      virtual-threads: ${LIVE_FEED_SSE_VIRTUAL_THREADS:false}
      # Open streams one user may hold per instance; the next one gets 429 (none is evicted).
      max-connections-per-user: ${LIVE_FEED_SSE_MAX_CONNECTIONS_PER_USER:5}
      # SSE retry: sent only with the resync that closes a stream whose handshake couldn't read the
      # feed (e.g. Redis down): base plus random jitter up to the second value, so clients back off.
      handshake-retry-ms: ${LIVE_FEED_SSE_HANDSHAKE_RETRY_MS:15000}
      handshake-retry-jitter-ms: ${LIVE_FEED_SSE_HANDSHAKE_RETRY_JITTER_MS:5000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder}
  api-key: ${CLOUDINARY_API_KEY:placeholder}
  api-secret: ${CLOUDINARY_API_SECRET:placeholder}

resend:
  api-key: ${RESEND_API_KEY:re_placeholder}
  from-address: ${RESEND_FROM_ADDRESS:noreply@livecomerce.com}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID}

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      show-details: when-authorized
  server:
    port: 8080

logging:
  level:
    com.livecomerce: INFO
    org.springframework.modulith: DEBUG
